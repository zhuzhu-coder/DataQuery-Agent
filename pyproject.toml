[project]
name = "data-query-agent"
version = "0.1.0"
description = "Natural language data query agent with metadata retrieval, SQL safety checks, and streaming responses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.11",
    "cryptography>=46.0.7",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.135.3",
    "greenlet>=3.4.0",
    "jieba>=0.42.1",
    "langchain>=1.2.15",
    "langchain-deepseek>=1.0.1",
    "langgraph>=1.1.6",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "openai>=1.109.1",
    "pymilvus>=2.6,<3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "redis>=5.2.1",
    "sqlalchemy>=2.0.49",
    "sqlglot>=30.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
